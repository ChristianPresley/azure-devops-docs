### YamlMime:Hub

title: Azure DevOps documentation
summary: Plan smarter, collaborate better, and ship faster. Bring Git repos, CI/CD pipelines, agile boards, package feeds, and test plans together in one place.
brand: azure
metadata:
  title: Azure DevOps documentation - boards, pipelines, repos, more
  description: Plan, build, test, and deploy with integrated DevOps tools for teams of any size. Azure DevOps provides source control, work tracking, CI/CD, and more.
  ms.topic: hub-page
  ms.subservice: azure-devops-projects
  ms.author: chcomley
  author: chcomley
  ms.date: 03/19/2026

